<!DOCTYPE html>
<html lang="es">

<script>
if (!localStorage.getItem("session")) {
    window.location.href = "login.html";
}
</script>

<head>
<meta charset="UTF-8">
<title>Editar Registro</title>
<link rel="stylesheet" href="../Estilos/styles.css">
</head>

<body>

<div class="sidebar">
    <div>
        <img class="logo" src="../Img/logo.png" alt="">
    </div>

    <div class="menu">
        <a href="dashboard.html">INICIO</a>
        <a href="index.html">REGISTROS</a>
        <a href="login.html" onclick="logout()">CERRAR SESIÓN</a>
    </div>
</div>

<div class="main">
    <div class="card">

        <div class="header">
            <h2>Editar Registro</h2>
        </div>

        <form id="form" class="form-grid"></form>

        <br>
        <button type="button" class="btn-success" onclick="guardar()">ACTUALIZAR</button>

    </div>
</div>

<script src="../Drivers/config.js"></script>
<script src="../Drivers/app.js"></script>

<script>
const form = document.getElementById("form");

// 📦 registros
let registros = JSON.parse(localStorage.getItem(config.tipo)) || [];

// 🟢 IMPORTANTE: ahora usamos editId (NO editIndex)
let editId = localStorage.getItem("editId");

// 🔍 buscar registro real
let data = registros.find(r => r.id == editId);

// ❌ validación correcta
if (!data) {
    alert("Registro no encontrado");
    window.location.href = "index.html";
}

// 🧱 generar inputs
config.campos.forEach(campo => {

    let div = document.createElement("div");

    let label = document.createElement("label");
    label.innerText = campo.label;

    let input = document.createElement("input");
    input.name = campo.name;
    input.placeholder = campo.label;
    input.value = data[campo.name] || "";

    div.appendChild(label);
    div.appendChild(input);

    form.appendChild(div);
});

// 💾 actualizar
function guardar() {

    let actualizado = {};
    let valido = true;

    config.campos.forEach(campo => {

        let input = document.querySelector(`[name="${campo.name}"]`);
        let valor = input.value.trim();

        if (!valor) {
            input.style.border = "1px solid red";
            valido = false;
        } else {
            input.style.border = "";
        }

        actualizado[campo.name] = valor;
    });

    if (!valido) {
        alert("Completa todos los campos");
        return;
    }

    // 🔄 buscar por ID
    let index = registros.findIndex(r => r.id == editId);

    if (index === -1) {
        alert("Error actualizando registro");
        return;
    }

    // actualizar sin perder ID
    registros[index] = {
        ...registros[index],
        ...actualizado
    };

    localStorage.setItem(config.tipo, JSON.stringify(registros));

    localStorage.removeItem("editId");

    window.location.href = "index.html";
}
</script>

</body>
</html>
